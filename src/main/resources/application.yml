server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: ms-cardapio
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cardapiodb}
    username: ${DB_USERNAME:cardapio}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  instance-id: ${HOSTNAME:${COMPUTERNAME:local}}
