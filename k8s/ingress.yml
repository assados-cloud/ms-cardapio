apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardapio
  namespace: lanchonete
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /cardapio
            pathType: Prefix
            backend:
              service:
                name: ms-cardapio
                port:
                  number: 8080
